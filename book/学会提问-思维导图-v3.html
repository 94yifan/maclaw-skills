<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>《学会提问》思维导图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f4f1;display:flex;flex-direction:column;align-items:center;padding:30px 10px;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
h1{font-size:24px;color:#1a1a2e;margin-bottom:2px;font-weight:600}
.p{font-size:13px;color:#888;margin-bottom:20px}
svg{background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,0.06);max-width:100%;height:auto}
</style></head><body>
<h1>《学会提问》思维导图</h1>
<p class="p">批判性思维五步法 · 六模块树形展开</p>

<svg viewBox="0 0 1200 950" width="1200" height="950" xmlns="http://www.w3.org/2000/svg">

  <!-- 中心到主枝连线 -->
  <g fill="none" stroke="#c9b99a" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <path d="M600,475 L320,180"/>
    <path d="M600,475 L220,460"/>
    <path d="M600,475 L320,740"/>
    <path d="M600,475 L830,140"/>
    <path d="M600,475 L900,480"/>
    <path d="M600,475 L830,820"/>
  </g>

  <!-- 主枝到次枝连线 -->
  <g fill="none" stroke="#d4c5a9" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <path d="M320,180 L120,90"/>
    <path d="M320,180 L120,190"/>
    <path d="M320,180 L120,290"/>
    <path d="M220,460 L60,400"/>
    <path d="M220,460 L60,520"/>
    <path d="M320,740 L120,660"/>
    <path d="M320,740 L120,760"/>
    <path d="M320,740 L120,860"/>
    <path d="M830,140 L1030,70"/>
    <path d="M830,140 L1030,170"/>
    <path d="M830,140 L1030,270"/>
    <path d="M900,480 L1060,410"/>
    <path d="M900,480 L1060,540"/>
    <path d="M830,820 L1030,740"/>
    <path d="M830,820 L1030,840"/>
    <path d="M830,820 L1030,940"/>
  </g>

  <!-- 中心 -->
  <rect x="500" y="440" width="200" height="70" rx="35" fill="#1a1a2e"/>
  <text x="600" y="470" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">学会提问</text>
  <text x="600" y="492" fill="#aaa" font-size="11" text-anchor="middle">批判性思维五步法</text>

  <!-- ======== 分支1：认知基础 ======== -->
  <rect x="250" y="145" width="140" height="70" rx="12" fill="#e8d5b7"/>
  <text x="320" y="172" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">认知基础</text>
  <text x="320" y="192" fill="#666" font-size="10" text-anchor="middle">第1-2章</text>

  <rect x="12" y="55" width="200" height="75" rx="8" fill="#f5efe4"/>
  <text x="112" y="76" fill="#334" font-size="12" font-weight="600" text-anchor="middle">海绵式思维</text>
  <text x="112" y="96" fill="#555" font-size="10" text-anchor="middle">像海绵吸水一样接收信息</text>
  <text x="112" y="112" fill="#888" font-size="9" text-anchor="middle">只求记住不求判断</text>

  <rect x="12" y="155" width="200" height="75" rx="8" fill="#f5efe4"/>
  <text x="112" y="176" fill="#334" font-size="12" font-weight="600" text-anchor="middle">淘金式思维</text>
  <text x="112" y="196" fill="#555" font-size="10" text-anchor="middle">主动筛选和追问信息</text>
  <text x="112" y="212" fill="#888" font-size="9" text-anchor="middle">边读边问：可信吗？有别的解释？</text>

  <rect x="12" y="255" width="200" height="75" rx="8" fill="#f5efe4"/>
  <text x="112" y="276" fill="#334" font-size="12" font-weight="600" text-anchor="middle">弱势vs强势批判</text>
  <text x="112" y="296" fill="#555" font-size="10" text-anchor="middle">弱势用来攻击别人捍卫自己</text>
  <text x="112" y="312" fill="#888" font-size="9" text-anchor="middle">强势用来检视一切包括自己</text>

  <!-- ======== 分支2：论证解剖 ======== -->
  <rect x="150" y="425" width="140" height="70" rx="12" fill="#d4c5ec"/>
  <text x="220" y="452" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">论证解剖</text>
  <text x="220" y="472" fill="#666" font-size="10" text-anchor="middle">第3-4章</text>

  <rect x="8" y="365" width="150" height="75" rx="8" fill="#efeaf6"/>
  <text x="83" y="386" fill="#334" font-size="12" font-weight="600" text-anchor="middle">找结论</text>
  <text x="83" y="406" fill="#555" font-size="10" text-anchor="middle">看指示词：因此、所以</text>
  <text x="83" y="422" fill="#888" font-size="9" text-anchor="middle">没指示词：自问想让我信什么</text>

  <rect x="8" y="488" width="150" height="75" rx="8" fill="#efeaf6"/>
  <text x="83" y="509" fill="#334" font-size="12" font-weight="600" text-anchor="middle">找理由</text>
  <text x="83" y="529" fill="#555" font-size="10" text-anchor="middle">看指示词：因为、由于</text>
  <text x="83" y="545" fill="#888" font-size="9" text-anchor="middle">没有理由的结论只是断言</text>

  <!-- ======== 分支3：未说之言 ======== -->
  <rect x="250" y="705" width="140" height="70" rx="12" fill="#b8d4e8"/>
  <text x="320" y="732" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">未说之言</text>
  <text x="320" y="752" fill="#666" font-size="10" text-anchor="middle">第5-6章</text>

  <rect x="12" y="625" width="200" height="75" rx="8" fill="#e0edf5"/>
  <text x="112" y="646" fill="#334" font-size="12" font-weight="600" text-anchor="middle">关键模糊词</text>
  <text x="112" y="666" fill="#555" font-size="10" text-anchor="middle">同一个词两人可能理解完全不同</text>
  <text x="112" y="682" fill="#888" font-size="9" text-anchor="middle">例子：公平是结果一样还是机会一样？</text>

  <rect x="12" y="725" width="200" height="75" rx="8" fill="#e0edf5"/>
  <text x="112" y="746" fill="#334" font-size="12" font-weight="600" text-anchor="middle">价值观假设</text>
  <text x="112" y="766" fill="#555" font-size="10" text-anchor="middle">没说出口的价值排序</text>
  <text x="112" y="782" fill="#888" font-size="9" text-anchor="middle">降税背后：个人比政府更会花钱</text>

  <rect x="12" y="825" width="200" height="75" rx="8" fill="#e0edf5"/>
  <text x="112" y="846" fill="#334" font-size="12" font-weight="600" text-anchor="middle">描述性假设</text>
  <text x="112" y="866" fill="#555" font-size="10" text-anchor="middle">对世界怎么运转的默认信念</text>
  <text x="112" y="882" fill="#888" font-size="9" text-anchor="middle">降税创造就业：企业会用省的钱招人</text>

  <!-- ======== 分支4：推理检查 ======== -->
  <rect x="760" y="105" width="140" height="70" rx="12" fill="#f0c4c4"/>
  <text x="830" y="132" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">推理检查</text>
  <text x="830" y="152" fill="#666" font-size="10" text-anchor="middle">第7章</text>

  <rect x="960" y="35" width="220" height="75" rx="8" fill="#fce8e8"/>
  <text x="1070" y="56" fill="#334" font-size="12" font-weight="600" text-anchor="middle">人身攻击</text>
  <text x="1070" y="76" fill="#555" font-size="10" text-anchor="middle">不反驳论点攻击提出论点的人</text>
  <text x="1070" y="92" fill="#888" font-size="9" text-anchor="middle">讨厌一个人时大脑拒绝他所有话</text>

  <rect x="960" y="135" width="220" height="75" rx="8" fill="#fce8e8"/>
  <text x="1070" y="156" fill="#334" font-size="12" font-weight="600" text-anchor="middle">滑坡论证</text>
  <text x="1070" y="176" fill="#555" font-size="10" text-anchor="middle">断言第一步必然导致最坏结果</text>
  <text x="1070" y="192" fill="#888" font-size="9" text-anchor="middle">中间每一步的必然性缺证据支撑</text>

  <rect x="960" y="235" width="220" height="75" rx="8" fill="#fce8e8"/>
  <text x="1070" y="256" fill="#334" font-size="12" font-weight="600" text-anchor="middle">其他七种谬误</text>
  <text x="1070" y="276" fill="#555" font-size="10" text-anchor="middle">虚假两难·诉诸公众·诉诸权威·循环论证</text>
  <text x="1070" y="292" fill="#888" font-size="9" text-anchor="middle">事后归因·稻草人谬误·诉诸情感</text>

  <!-- ======== 分支5：证据检验 ======== -->
  <rect x="830" y="445" width="140" height="70" rx="12" fill="#c4e8c4"/>
  <text x="900" y="472" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">证据检验</text>
  <text x="900" y="492" fill="#666" font-size="10" text-anchor="middle">第8-11章</text>

  <rect x="980" y="375" width="200" height="75" rx="8" fill="#e8f6e8"/>
  <text x="1080" y="396" fill="#334" font-size="12" font-weight="600" text-anchor="middle">证据金字塔</text>
  <text x="1080" y="416" fill="#555" font-size="10" text-anchor="middle">直觉→个人经历→专家意见</text>
  <text x="1080" y="432" fill="#888" font-size="9" text-anchor="middle">→统计数据（最强但陷阱最多）</text>

  <rect x="980" y="505" width="200" height="75" rx="8" fill="#e8f6e8"/>
  <text x="1080" y="526" fill="#334" font-size="12" font-weight="600" text-anchor="middle">三大数据陷阱</text>
  <text x="1080" y="546" fill="#555" font-size="10" text-anchor="middle">平均值的不同含义·增长率基数小</text>
  <text x="1080" y="562" fill="#888" font-size="9" text-anchor="middle">只展示有利不提不利</text>

  <!-- ======== 分支6：综合判断 ======== -->
  <rect x="760" y="785" width="140" height="70" rx="12" fill="#e8c4a0"/>
  <text x="830" y="812" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">综合判断</text>
  <text x="830" y="832" fill="#666" font-size="10" text-anchor="middle">第12-14章</text>

  <rect x="960" y="705" width="220" height="75" rx="8" fill="#f3e8db"/>
  <text x="1070" y="726" fill="#334" font-size="12" font-weight="600" text-anchor="middle">遗漏信息</text>
  <text x="1070" y="746" fill="#555" font-size="10" text-anchor="middle">每个论证都经过筛选</text>
  <text x="1070" y="762" fill="#888" font-size="9" text-anchor="middle">核心问：他为什么不提这个？</text>

  <rect x="960" y="805" width="220" height="75" rx="8" fill="#f3e8db"/>
  <text x="1070" y="826" fill="#334" font-size="12" font-weight="600" text-anchor="middle">替代原因</text>
  <text x="1070" y="846" fill="#555" font-size="10" text-anchor="middle">一个现象至少有5种可能解释</text>
  <text x="1070" y="862" fill="#888" font-size="9" text-anchor="middle">接受因果解释前先列3个替代可能</text>

</svg>
</body></html>
