<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热点借势营销 SOP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f1f5f9;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: 20px;
  }
  .container {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 24px;
  }
  svg { display: block; }
</style>
</head>
<body>
<div class="container">
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="800" viewBox="0 0 780 800">
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
<rect width="780" height="800" fill="#f8fafc"/>
<text x="390" y="22" text-anchor="middle" font-family="-apple-system, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#1e293b">热点借势营销 SOP</text>
<text x="390" y="40" text-anchor="middle" font-family="-apple-system, PingFang SC, sans-serif" font-size="12" fill="#64748b">追踪 → 判断 → 响应 → 植入 → 投放 → 沉淀</text>
<rect x="240" y="85" width="300" height="70" rx="12" ry="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2"/>

<text x="238" y="213" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#475569">1 能不能玩梗  2 是不是二创期  3 挂不挂得上品牌</text>
<line x1="560" y1="204" x2="605" y2="204" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
<text x="568" y="196" font-family="-apple-system, PingFang SC, sans-serif" font-size="10" fill="#dc2626">任一不过</text>
<rect x="610" y="186" width="70" height="36" rx="18" ry="18" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="2"/>

<text x="228" y="313" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#475569">达人1-2天 · 投流2-3天 · 搜索起势同步</text>

<rect x="190" y="445" width="400" height="96" rx="12" ry="12" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-width="2"/>

<text x="208" y="493" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#475569">人群 · 四向定向</text>
<text x="208" y="511" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#475569">渠道 · 信息流 视频流 搜索卡热点词</text>
<line x1="390" y1="541" x2="390" y2="585" stroke="#1e293b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="210" y="585" width="360" height="96" rx="12" ry="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2"/>

<text x="228" y="633" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#475569">预算 · KOL48% 信息流30% 视频流15% 搜索7%</text>
<text x="228" y="651" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#475569">验证 · 话题溢出 2.2 倍</text>
<path d="M 390 681 L 390 696 L 30 696 L 30 70 L 390 70" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
<text x="35" y="383" font-family="-apple-system, PingFang SC, sans-serif" font-size="11" fill="#2563eb" writing-mode="tb">沉淀打法，复用到下一个热点</text>
