<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* 曼拾 A4 竖版模板 · 四 VI 色 · 黑字优先 · 所有尺寸乘全局系数 K */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#FFFFFF;-webkit-font-smoothing:antialiased}
body{font-family:'Hiragino Sans GB','Songti SC',sans-serif;color:#1A1A1A}
.serif{font-family:'Songti SC','Hiragino Sans GB',serif}
.en{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-style:normal}
.red{color:#F8223E}.lr{color:#F93957}

/* ── 页面与页边距（K=PAGE_ZOOM） ── */
body{width:2480px;height:3508px;overflow:hidden;position:relative}
.pad{position:absolute;left:112px;right:112px;top:98px;bottom:76px;display:flex;flex-direction:column}

/* ── 页头 ── */
.head{display:flex;align-items:center;justify-content:space-between}
.head img{width:148px;height:148px}
.bname{font-size:86px;letter-spacing:12px;line-height:1;color:#F8223E}
.ben{font-size:28px;letter-spacing:9px;margin-top:6px;color:#F93957}
.y10{background:#F8223E;color:#fff;font-size:26px;padding:9px 24px;border-radius:40px;margin-left:24px}
.tag{text-align:right;font-size:28px;line-height:1.6;color:#F8223E}

/* ── 正文 ── */
.lead{font-size:52px;line-height:1.55;margin-top:38px;padding-left:34px;border-left:12px solid #F8223E;font-weight:500}
.p{font-size:44px;line-height:1.68;margin-top:22px;text-align:justify}
.h2{font-size:62px;line-height:1.3;margin-top:58px;color:#F8223E;font-weight:600;position:relative;z-index:1}

/* ── 元素板块（大标题 + 元素水印） ── */
.sec{margin-top:40px}
.feng{position:relative}
.feng .wm{position:absolute;right:-10px;top:-46px;width:450px;opacity:0.13;z-index:0}
.feng .wm.clover{width:285px;top:-34px;right:-4px;opacity:0.10}

/* ── 五心 ── */
.heart{display:flex;gap:26px;padding-top:24px;margin-top:24px;border-top:3px solid #FFEADF}
.heart.first{border-top:none;padding-top:0;margin-top:10px}
.coin{width:60px;height:60px;border-radius:50%;background:#F8223E;color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:34px;flex:0 0 60px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:600}
.hn{display:flex;align-items:baseline;gap:18px}
.hn b{font-size:56px;color:#F8223E;letter-spacing:4px}
.hn i{font-size:30px;color:#F93957;letter-spacing:4px}
.hn u{text-decoration:none;font-size:32px;color:#8A5049;margin-left:10px}
.heart p{font-size:42px;line-height:1.62;margin-top:10px;text-align:justify}

/* ── 强调条 / 引文 / 结尾三块 ── */
.stem{background:#FFEADF;border-left:14px solid #F8223E;border-radius:4px;padding:20px 30px;margin-top:22px;font-size:44px;line-height:1.6}
.stem b{color:#F8223E}
.quote{background:#FFEADF;border-left:14px solid #F93957;border-radius:4px;padding:20px 30px;margin-top:20px;font-size:42px;line-height:1.7;text-align:justify}
.trio{display:flex;gap:26px;margin-top:30px}
.tri{flex:1 1 0;background:#FFEADF;border-radius:16px;padding:24px 26px}
.tri h3{font-size:50px;color:#F8223E;letter-spacing:3px;font-weight:600}
.tri p{font-size:38px;line-height:1.62;margin-top:14px}

/* ── 页脚（必须在 flex 容器内 + margin-top:auto） ── */
footer{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;
  align-items:flex-end;font-size:28px;color:#3A3836;letter-spacing:3px}
footer .en{color:#F93957;letter-spacing:6px}
</style></head><body><div class="pad">
  <div class="head">
    <div style="display:flex;align-items:center">
      <img src="{{LOGO_RED}}">
      <div style="margin-left:26px"><div class="bname serif">曼拾</div><div class="ben en">MEANSPLUS</div></div>
      <span class="y10">{{BADGE}}</span>
    </div>
    <div class="tag">{{TAG}}<br><span class="en">{{TAG_EN}}</span></div>
  </div>

  <div class="lead">{{LEAD}}</div>

  <div class="sec feng">
    <img class="wm clover" src="{{CLOVER}}">
    <div class="h2 serif">{{SEC1_TITLE}}</div>
    {{SEC1_BODY}}
  </div>

  <div class="sec feng">
    <img class="wm" src="{{PATTERN}}">
    <div class="h2 serif">{{SEC2_TITLE}}</div>
    {{SEC2_BODY}}
  </div>

  <footer><div>{{FOOT}}</div><div class="en">MEANSPLUS</div></footer>
</div></body></html>
