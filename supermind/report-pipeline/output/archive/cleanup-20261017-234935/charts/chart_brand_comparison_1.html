<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>天猫旗舰店爆款销售对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; background: white; }
  #chart { width: 800px; height: 420px; }
</style>
</head>
<body>
<div id="chart"></div>
<script>

option = {
    title: { text: '天猫旗舰店爆款销售对比', subtext: '数据来源: 天猫旗舰店', left: 'center' },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    grid: { left: '3%', right: '8%', bottom: '8%', containLabel: true },
    xAxis: { type: 'value', name: '已售/付款数', nameLocation: 'middle', nameGap: 30 },
    yAxis: { type: 'category', data: ["有友食品", "劲仔食品", "盐津铺子", "无穷食品", "卤味觉醒", "周黑鸭", "区域凤爪品牌", "区域卤味零食品牌"], axisLabel: { fontSize: 12 } },
    series: [{
        name: '品牌名称对比',
        type: 'bar',
        data: [80, 65, 55, 40, 25, 45, 8, 5],
        barWidth: '60%',
        label: { show: true, position: 'right', formatter: function(p) { return p.value; } },
        itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#4A90D9' },
            { offset: 1, color: '#7B68EE' }
        ]) }
    }]
};
var chart = echarts.init(document.getElementById('chart'));
chart.setOption(option);
</script>
</body>
</html>
