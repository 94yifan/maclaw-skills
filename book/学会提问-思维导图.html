<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>《学会提问》知识地图</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #f5f4f1;
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 {
  font-size: 28px;
  color: #1a1a2e;
  margin-bottom: 4px;
  font-weight: 600;
  letter-spacing: 1px;
}
.sub {
  font-size: 14px;
  color: #666;
  margin-bottom: 24px;
}
.mindmap {
  width: 1200px;
  height: 800px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  overflow: hidden;
  position: relative;
}
svg text {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
}
</style>
</head>
<body>
<h1>《学会提问》知识地图</h1>
<p class="sub">批判性思维 · 五步提问法框架 · 尼尔·布朗 / 斯图尔特·基利</p>

<div class="mindmap">
<svg viewBox="0 0 1200 800" width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- 连接线 -->
  <g fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">

    <!-- 中心→五大分支 -->
    <path stroke="#c9b99a" d="M600,380 L340,160" />
    <path stroke="#c9b99a" d="M600,380 L340,380" />
    <path stroke="#c9b99a" d="M600,380 L340,600" />
    <path stroke="#c9b99a" d="M600,380 L860,120" />
    <path stroke="#c9b99a" d="M600,380 L860,380" />
    <path stroke="#c9b99a" d="M600,380 L860,640" />

    <!-- 分支1：认知基础（右上）→子节点 -->
    <path stroke="#d4c5a9" d="M340,160 L220,80" />
    <path stroke="#d4c5a9" d="M340,160 L220,160" />
    <path stroke="#d4c5a9" d="M340,160 L220,240" />

    <!-- 分支2：他在说什么（右下）→子节点 -->
    <path stroke="#d4c5a9" d="M340,380 L220,340" />
    <path stroke="#d4c5a9" d="M340,380 L220,420" />
    <path stroke="#d4c5a9" d="M340,380 L220,500" />

    <!-- 分支3：解读词意+假设（下方）→子节点 -->
    <path stroke="#d4c5a9" d="M340,600 L240,640" />
    <path stroke="#d4c5a9" d="M340,600 L240,720" />

    <!-- 分支4：推理检查（左上）→子节点 -->
    <path stroke="#d4c5a9" d="M860,120 L1000,80" />
    <path stroke="#d4c5a9" d="M860,120 L1000,160" />

    <!-- 分支5：证据检验+综合（左中）→子节点 -->
    <path stroke="#d4c5a9" d="M860,380 L1040,320" />
    <path stroke="#d4c5a9" d="M860,380 L1040,400" />
    <path stroke="#d4c5a9" d="M860,380 L1040,480" />

    <!-- 分支6：综合判断（左下）→子节点 -->
    <path stroke="#d4c5a9" d="M860,640 L1000,640" />
    <path stroke="#d4c5a9" d="M860,640 L1000,720" />
  </g>

  <!-- 中心节点 -->
  <rect x="480" y="320" width="240" height="120" rx="60" fill="#1a1a2e"/>
  <text x="600" y="360" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">学会提问</text>
  <text x="600" y="390" fill="#aaa" font-size="12" text-anchor="middle">批判性思维五步法</text>

  <!-- 分支1节点：认知基础 -->
  <rect x="280" y="120" width="120" height="80" rx="12" fill="#e8d5b7"/>
  <text x="340" y="152" fill="#1a1a2e" font-size="14" font-weight="600" text-anchor="middle">认知基础</text>
  <text x="340" y="172" fill="#666" font-size="11" text-anchor="middle">第1-2章</text>

  <!-- 分支1子节点 -->
  <rect x="80" y="48" width="140" height="64" rx="8" fill="#f5f0e6"/>
  <text x="150" y="72" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">海绵 vs 淘金</text>
  <text x="150" y="92" fill="#888" font-size="10" text-anchor="middle">被动吸收/主动筛选</text>

  <rect x="80" y="128" width="140" height="64" rx="8" fill="#f5f0e6"/>
  <text x="150" y="152" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">弱 vs 强批判性</text>
  <text x="150" y="172" fill="#888" font-size="10" text-anchor="middle">求真 vs 求赢</text>

  <rect x="80" y="208" width="140" height="64" rx="8" fill="#f5f0e6"/>
  <text x="150" y="232" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">大象 vs 骑手</text>
  <text x="150" y="252" fill="#888" font-size="10" text-anchor="middle">情感支配理性</text>

  <!-- 分支2节点：他在说什么 -->
  <rect x="280" y="340" width="120" height="80" rx="12" fill="#d4c5ec"/>
  <text x="340" y="372" fill="#1a1a2e" font-size="14" font-weight="600" text-anchor="middle">他在说什么</text>
  <text x="340" y="392" fill="#666" font-size="11" text-anchor="middle">第3-4章</text>

  <!-- 分支2子节点 -->
  <rect x="60" y="308" width="160" height="64" rx="8" fill="#f0ebf8"/>
  <text x="140" y="332" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">两种论题</text>
  <text x="140" y="352" fill="#888" font-size="10" text-anchor="middle">描述性vs规范性</text>

  <rect x="60" y="388" width="160" height="64" rx="8" fill="#f0ebf8"/>
  <text x="140" y="412" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">结论+理由</text>
  <text x="140" y="432" fill="#888" font-size="10" text-anchor="middle">论证=结论+理由</text>

  <rect x="60" y="468" width="160" height="64" rx="8" fill="#f0ebf8"/>
  <text x="140" y="492" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">三段标记法</text>
  <text x="140" y="512" fill="#888" font-size="10" text-anchor="middle">△○？拆解论证</text>

  <!-- 分支3节点：解读词意+假设 -->
  <rect x="280" y="560" width="120" height="80" rx="12" fill="#b8d4e8"/>
  <text x="340" y="592" fill="#1a1a2e" font-size="14" font-weight="600" text-anchor="middle">读懂未说之言</text>
  <text x="340" y="612" fill="#666" font-size="11" text-anchor="middle">第5-6章</text>

  <!-- 分支3子节点 -->
  <rect x="60" y="608" width="180" height="64" rx="8" fill="#e8f0f6"/>
  <text x="150" y="632" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">歧义词识别</text>
  <text x="150" y="652" fill="#888" font-size="10" text-anchor="middle">关键模糊词陷阱</text>

  <rect x="60" y="688" width="180" height="64" rx="8" fill="#e8f0f6"/>
  <text x="150" y="712" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">两种假设</text>
  <text x="150" y="732" fill="#888" font-size="10" text-anchor="middle">价值观+描述性假设</text>

  <!-- 分支4节点：推理检查 -->
  <rect x="800" y="80" width="120" height="80" rx="12" fill="#f0c4c4"/>
  <text x="860" y="112" fill="#1a1a2e" font-size="14" font-weight="600" text-anchor="middle">推理检查</text>
  <text x="860" y="132" fill="#666" font-size="11" text-anchor="middle">第7章</text>

  <!-- 分支4子节点 -->
  <rect x="920" y="48" width="220" height="64" rx="8" fill="#fce8e8"/>
  <text x="1030" y="72" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">9种推理谬误</text>
  <text x="1030" y="92" fill="#888" font-size="10" text-anchor="middle">人身/滑坡/两难/公众/权威</text>

  <rect x="920" y="128" width="220" height="64" rx="8" fill="#fce8e8"/>
  <text x="1030" y="148" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">循环/事后/稻草人/情感</text>
  <text x="1030" y="172" fill="#888" font-size="10" text-anchor="middle">每种谬误都有认知偏误支撑</text>

  <!-- 分支5节点：证据检验 -->
  <rect x="800" y="340" width="120" height="80" rx="12" fill="#c4e8c4"/>
  <text x="860" y="372" fill="#1a1a2e" font-size="14" font-weight="600" text-anchor="middle">证据检验</text>
  <text x="860" y="392" fill="#666" font-size="11" text-anchor="middle">第8-11章</text>

  <!-- 分支5子节点 -->
  <rect x="940" y="288" width="220" height="64" rx="8" fill="#e8f6e8"/>
  <text x="1050" y="312" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">证据金字塔</text>
  <text x="1050" y="332" fill="#888" font-size="10" text-anchor="middle">直觉→个人→专家→数据</text>

  <rect x="940" y="368" width="220" height="64" rx="8" fill="#e8f6e8"/>
  <text x="1050" y="392" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">三大数据陷阱</text>
  <text x="1050" y="412" fill="#888" font-size="10" text-anchor="middle">平均/增长/选择性呈现</text>

  <rect x="940" y="448" width="220" height="64" rx="8" fill="#e8f6e8"/>
  <text x="1050" y="472" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">替代原因</text>
  <text x="1050" y="492" fill="#888" font-size="10" text-anchor="middle">列至少3个替代可能</text>

  <!-- 分支6节点：综合判断 -->
  <rect x="800" y="600" width="120" height="80" rx="12" fill="#e8c4a0"/>
  <text x="860" y="632" fill="#1a1a2e" font-size="14" font-weight="600" text-anchor="middle">综合判断</text>
  <text x="860" y="652" fill="#666" font-size="11" text-anchor="middle">第12-14章</text>

  <!-- 分支6子节点 -->
  <rect x="920" y="608" width="200" height="64" rx="8" fill="#f6ece0"/>
  <text x="1020" y="632" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">遗漏信息7类型</text>
  <text x="1020" y="652" fill="#888" font-size="10" text-anchor="middle">他不提什么？</text>

  <rect x="920" y="688" width="200" height="64" rx="8" fill="#f6ece0"/>
  <text x="1020" y="712" fill="#1a1a2e" font-size="12" font-weight="500" text-anchor="middle">10问清单</text>
  <text x="1020" y="732" fill="#888" font-size="10" text-anchor="middle">从论题到最终评分</text>

</svg>
</div>
</body>
</html>
