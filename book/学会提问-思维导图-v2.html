<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>《学会提问》思维导图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f4f1;display:flex;flex-direction:column;align-items:center;padding:30px;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
h1{font-size:24px;color:#1a1a2e;margin-bottom:4px;font-weight:600}
.sub{font-size:13px;color:#888;margin-bottom:20px}
svg{background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,0.06);max-width:100%}
</style></head>
<body>
<h1>《学会提问》思维导图</h1>
<p class="sub">批判性思维五步法 · 六模块树形展开</p>
<svg viewBox="0 0 1100 850" width="1100" height="850" xmlns="http://www.w3.org/2000/svg">

  <!-- 中心→主枝连接线 -->
  <g fill="none" stroke="#c9b99a" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <path d="M550,425 L300,160"/>
    <path d="M550,425 L200,380"/>
    <path d="M550,425 L300,600"/>
    <path d="M550,425 L750,120"/>
    <path d="M550,425 L850,380"/>
    <path d="M550,425 L750,640"/>
  </g>

  <!-- 主枝→次枝连接线（左侧） -->
  <g fill="none" stroke="#d4c5a9" stroke-width="1.5" opacity="0.45" stroke-linecap="round">
    <path d="M300,160 L120,80"/>
    <path d="M300,160 L120,170"/>
    <path d="M300,160 L120,250"/>
    <path d="M200,380 L60,330"/>
    <path d="M200,380 L60,430"/>
    <path d="M300,600 L120,540"/>
    <path d="M300,600 L120,630"/>
    <path d="M300,600 L120,700"/>
  </g>

  <!-- 主枝→次枝连接线（右侧） -->
  <g fill="none" stroke="#d4c5a9" stroke-width="1.5" opacity="0.45" stroke-linecap="round">
    <path d="M750,120 L920,50"/>
    <path d="M750,120 L920,130"/>
    <path d="M750,120 L920,210"/>
    <path d="M850,380 L1020,340"/>
    <path d="M850,380 L1020,430"/>
    <path d="M750,640 L920,580"/>
    <path d="M750,640 L920,680"/>
    <path d="M750,640 L920,760"/>
  </g>

  <!-- 中心节点 -->
  <rect x="430" y="390" width="240" height="70" rx="35" fill="#1a1a2e"/>
  <text x="550" y="420" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">学会提问</text>
  <text x="550" y="442" fill="#999" font-size="11" text-anchor="middle">批判性思维五步法 · 淘金式筛选</text>

  <!-- ===== 分支1：认知基础（左上） ===== -->
  <rect x="230" y="125" width="140" height="70" rx="12" fill="#e8d5b7"/>
  <text x="300" y="152" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">认知基础</text>
  <text x="300" y="172" fill="#666" font-size="10" text-anchor="middle">第1-2章</text>

  <rect x="30" y="48" width="160" height="56" rx="8" fill="#f5efe4"/>
  <text x="110" y="72" fill="#334" font-size="11" font-weight="600" text-anchor="middle">海绵式思维</text>
  <text x="110" y="90" fill="#777" font-size="10" text-anchor="middle">被动吸收，目标记</text>

  <rect x="30" y="140" width="160" height="56" rx="8" fill="#f5efe4"/>
  <text x="110" y="164" fill="#334" font-size="11" font-weight="600" text-anchor="middle">淘金式思维</text>
  <text x="110" y="182" fill="#777" font-size="10" text-anchor="middle">主动筛选，目标判</text>

  <rect x="30" y="218" width="160" height="56" rx="8" fill="#f5efe4"/>
  <text x="110" y="242" fill="#334" font-size="11" font-weight="600" text-anchor="middle">弱势vs强势批判</text>
  <text x="110" y="260" fill="#777" font-size="10" text-anchor="middle">守己 vs 审全</text>

  <!-- ===== 分支2：论证解剖（左中） ===== -->
  <rect x="130" y="345" width="140" height="70" rx="12" fill="#d4c5ec"/>
  <text x="200" y="372" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">论证解剖</text>
  <text x="200" y="392" fill="#666" font-size="10" text-anchor="middle">第3-4章</text>

  <rect x="10" y="300" width="130" height="56" rx="8" fill="#efeaf6"/>
  <text x="75" y="324" fill="#334" font-size="11" font-weight="600" text-anchor="middle">找结论</text>
  <text x="75" y="342" fill="#777" font-size="10" text-anchor="middle">因此所以由此可见</text>

  <rect x="10" y="400" width="130" height="56" rx="8" fill="#efeaf6"/>
  <text x="75" y="424" fill="#334" font-size="11" font-weight="600" text-anchor="middle">找理由</text>
  <text x="75" y="442" fill="#777" font-size="10" text-anchor="middle">因为由于基于</text>

  <!-- ===== 分支3：未说之言（左下） ===== -->
  <rect x="230" y="565" width="140" height="70" rx="12" fill="#b8d4e8"/>
  <text x="300" y="592" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">未说之言</text>
  <text x="300" y="612" fill="#666" font-size="10" text-anchor="middle">第5-6章</text>

  <rect x="30" y="508" width="160" height="56" rx="8" fill="#e0edf5"/>
  <text x="110" y="532" fill="#334" font-size="11" font-weight="600" text-anchor="middle">模糊词陷阱</text>
  <text x="110" y="550" fill="#777" font-size="10" text-anchor="middle">同词不同义</text>

  <rect x="30" y="598" width="160" height="56" rx="8" fill="#e0edf5"/>
  <text x="110" y="622" fill="#334" font-size="11" font-weight="600" text-anchor="middle">价值观假设</text>
  <text x="110" y="640" fill="#777" font-size="10" text-anchor="middle">什么更重要</text>

  <rect x="30" y="668" width="160" height="56" rx="8" fill="#e0edf5"/>
  <text x="110" y="692" fill="#334" font-size="11" font-weight="600" text-anchor="middle">描述性假设</text>
  <text x="110" y="710" fill="#777" font-size="10" text-anchor="middle">世界怎么运转</text>

  <!-- ===== 分支4：推理检查（右上） ===== -->
  <rect x="680" y="85" width="140" height="70" rx="12" fill="#f0c4c4"/>
  <text x="750" y="112" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">推理检查</text>
  <text x="750" y="132" fill="#666" font-size="10" text-anchor="middle">第7章</text>

  <rect x="860" y="18" width="200" height="56" rx="8" fill="#fce8e8"/>
  <text x="960" y="42" fill="#334" font-size="11" font-weight="600" text-anchor="middle">人身攻击</text>
  <text x="960" y="60" fill="#777" font-size="10" text-anchor="middle">攻人而非论点</text>

  <rect x="860" y="98" width="200" height="56" rx="8" fill="#fce8e8"/>
  <text x="960" y="122" fill="#334" font-size="11" font-weight="600" text-anchor="middle">滑坡论证</text>
  <text x="960" y="140" fill="#777" font-size="10" text-anchor="middle">一步到最坏</text>

  <rect x="860" y="178" width="200" height="56" rx="8" fill="#fce8e8"/>
  <text x="960" y="202" fill="#334" font-size="11" font-weight="600" text-anchor="middle">更多谬误</text>
  <text x="960" y="220" fill="#777" font-size="10" text-anchor="middle">两难/公众/权威/循环/事后/稻草人/情感</text>

  <!-- ===== 分支5：证据检验（右中） ===== -->
  <rect x="780" y="345" width="140" height="70" rx="12" fill="#c4e8c4"/>
  <text x="850" y="372" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">证据检验</text>
  <text x="850" y="392" fill="#666" font-size="10" text-anchor="middle">第8-11章</text>

  <rect x="940" y="308" width="140" height="56" rx="8" fill="#e8f6e8"/>
  <text x="1010" y="332" fill="#334" font-size="11" font-weight="600" text-anchor="middle">证据金字塔</text>
  <text x="1010" y="350" fill="#777" font-size="10" text-anchor="middle">直觉→个→专家→数</text>

  <rect x="940" y="398" width="140" height="56" rx="8" fill="#e8f6e8"/>
  <text x="1010" y="422" fill="#334" font-size="11" font-weight="600" text-anchor="middle">三大数据陷阱</text>
  <text x="1010" y="440" fill="#777" font-size="10" text-anchor="middle">平均/增长/选择性</text>

  <!-- ===== 分支6：综合判断（右下） ===== -->
  <rect x="680" y="605" width="140" height="70" rx="12" fill="#e8c4a0"/>
  <text x="750" y="632" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">综合判断</text>
  <text x="750" y="652" fill="#666" font-size="10" text-anchor="middle">第12-14章</text>

  <rect x="860" y="548" width="200" height="56" rx="8" fill="#f3e8db"/>
  <text x="960" y="572" fill="#334" font-size="11" font-weight="600" text-anchor="middle">遗漏信息</text>
  <text x="960" y="590" fill="#777" font-size="10" text-anchor="middle">不说的比说的重要</text>

  <rect x="860" y="648" width="200" height="56" rx="8" fill="#f3e8db"/>
  <text x="960" y="672" fill="#334" font-size="11" font-weight="600" text-anchor="middle">替代原因</text>
  <text x="960" y="690" fill="#777" font-size="10" text-anchor="middle">至少找3个可能</text>

  <rect x="860" y="728" width="200" height="56" rx="8" fill="#f3e8db"/>
  <text x="960" y="752" fill="#334" font-size="11" font-weight="600" text-anchor="middle">10问清单</text>
  <text x="960" y="770" fill="#777" font-size="10" text-anchor="middle">从论题到综合评分</text>

</svg>
</body>
</html>
