<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=420">
<title>价格带对比 · 榴芒一刻 vs 溜溜梅 vs 菲诺</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#fff}
  #chart{width:800px;height:420px}
  .source{text-align:right;font-size:9px;color:#999;padding:2px 8px 0 0}
</style>
</head>
<body>
<div id="chart"></div>
<div class="source">来源：天猫旗舰店，2026-07-18实时抓取</div>
<script>
var chart = echarts.init(document.getElementById('chart'));
var brands = ['菲诺', '溜溜梅', '榴芒一刻'];
var colors = {'菲诺':'#4A90D9','溜溜梅':'#E8574A','榴芒一刻':'#F5A623'};
var data = [
  {name:'菲诺', min:9, max:149},
  {name:'溜溜梅', min:9.9, max:79},
  {name:'榴芒一刻', min:29, max:298}
].reverse();

var option = {
  tooltip: {
    trigger:'axis',
    axisPointer:{type:'shadow'},
    formatter:function(p){
      var d=data.find(x=>x.name===p[0].name);
      return d.name+'<br/>价格带：<b>¥'+d.min+' - ¥'+d.max+'</b>';
    }
  },
  grid: {left:80,right:100,top:30,bottom:40},
  legend: {show:false},
  xAxis: {
    type:'value',
    name:'价格（元）',
    max:320,
    axisLabel:{formatter:'¥{value}'}
  },
  yAxis: {
    type:'category',
    data:data.map(d=>d.name),
    axisLabel:{fontSize:12,fontWeight:'bold'}
  },
  series: [
    {
      name:'起价',
      type:'bar',
      stack:'total',
      data:data.map(d=>d.min),
      itemStyle:{color:'transparent'},
      barWidth:32
    },
    {
      name:'价格区间',
      type:'bar',
      stack:'total',
      data:data.map(d=>({value:d.max-d.min,itemStyle:{color:colors[d.name],borderRadius:[0,6,6,0]}})),
      barWidth:32,
      label:{
        show:true,
        position:'right',
        formatter:function(p){
          var d=data.find(x=>x.name===p.name);
          return '¥'+d.min+' - ¥'+d.max;
        },
        fontSize:11,
        color:'#333'
      },
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,0.15)'}}
    }
  ]
};
chart.setOption(option);
window.addEventListener('resize',()=>chart.resize());
</script>
</body>
</html>
