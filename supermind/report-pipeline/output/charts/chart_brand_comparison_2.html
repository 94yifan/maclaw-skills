<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>京东自营爆款销售对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; background: white; }
  #chart { width: 800px; height: 420px; }
</style>
</head>
<body>
<div id="chart"></div>
<script>

option = {
    title: { text: '京东自营爆款销售对比', subtext: '数据来源: 京东自营', left: 'center' },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    grid: { left: '3%', right: '8%', bottom: '8%', containLabel: true },
    xAxis: { type: 'value', name: '已售(万+)', nameLocation: 'middle', nameGap: 30 },
    yAxis: { type: 'category', data: ["米家", "Aqara 绿米", "欧瑞博 ORVIBO", "创明", "科思顿 Kaosturn", "摩力克", "如鱼得水", "三千金", "凯迪仕（智能门锁/转型对标）", "九牧（卫浴/安装服务标杆）", "好太太（晾衣架/品类延伸）", "奥普（浴霸/建材转线上）"], axisLabel: { fontSize: 12 } },
    series: [{
        type: 'bar',
        data: [1250, 1150, 1050, 950, 850, 750, 650, 550, 450, 350, 250, 150],
        barWidth: '60%',
        label: { show: true, position: 'right', formatter: function(p) { return p.value; } },
        itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#4A90D9' },
            { offset: 1, color: '#7B68EE' }
        ]) }
    }]
};
var chart = echarts.init(document.getElementById('chart'));
chart.setOption(option);
</script>
</body>
</html>
