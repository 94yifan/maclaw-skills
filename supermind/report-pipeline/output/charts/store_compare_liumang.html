<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=420">
<title>店铺评分+开店年限对比 · 榴芒一刻 vs 溜溜梅 vs 菲诺</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#fff}
  #chart{width:800px;height:420px}
  .source{text-align:right;font-size:9px;color:#999;padding:2px 8px 0 0}
</style>
</head>
<body>
<div id="chart"></div>
<div class="source">来源：天猫旗舰店，2026-07-18实时抓取 · 菲诺评分为综合评分</div>
<script>
var chart = echarts.init(document.getElementById('chart'));
var brands = ['榴芒一刻','溜溜梅','菲诺'];
// 描述相符/服务态度/物流服务  菲诺只有综合
var scores = [
  {name:'榴芒一刻', desc:4.9, svc:4.4, logi:5.0, years:10},
  {name:'溜溜梅', desc:5.0, svc:4.9, logi:4.8, years:14},
  {name:'菲诺', desc:4.9, svc:4.9, logi:4.9, years:null, hasComposite:true}
];
var colors = {'榴芒一刻':'#F5A623','溜溜梅':'#E8574A','菲诺':'#4A90D9'};

var option = {
  tooltip: {trigger:'axis'},
  legend: {
    data:['描述相符','服务态度','物流服务'],
    bottom:0,
    textStyle:{fontSize:10}
  },
  grid: {left:80,right:40,top:20,bottom:50},
  xAxis: {
    type:'category',
    data:brands,
    axisLabel:{fontSize:12,fontWeight:'bold'}
  },
  yAxis: [{
    type:'value', name:'评分', min:4.0, max:5.2,
    axisLabel:{formatter:'{value}'}
  }],
  series: [
    {
      name:'描述相符', type:'bar',
      data:[
        {value:4.9,itemStyle:{color:'#FF8C42'}},
        {value:5.0,itemStyle:{color:'#FF8C42'}},
        {value:4.9,itemStyle:{color:'#FF8C42'}}
      ],
      barWidth:28, barGap:'10%',
      label:{show:true,position:'top',fontSize:10,formatter:'{c}'},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,0.15)'}}
    },
    {
      name:'服务态度', type:'bar',
      data:[
        {value:4.4,itemStyle:{color:'#7B68EE'}},
        {value:4.9,itemStyle:{color:'#7B68EE'}},
        {value:4.9,itemStyle:{color:'#7B68EE'}}
      ],
      barWidth:28,
      label:{show:true,position:'top',fontSize:10,formatter:'{c}'},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,0.15)'}}
    },
    {
      name:'物流服务', type:'bar',
      data:[
        {value:5.0,itemStyle:{color:'#5DADE2'}},
        {value:4.8,itemStyle:{color:'#5DADE2'}},
        {value:4.9,itemStyle:{color:'#5DADE2'}}
      ],
      barWidth:28,
      label:{show:true,position:'top',fontSize:10,formatter:'{c}'},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,0.15)'}},
      markLine:{
        silent:true,
        symbol:'none',
        label:{formatter:'开店年限',fontSize:9},
        data:[
          {xAxis:'榴芒一刻',label:{formatter:'10年\n老店'},lineStyle:{color:'#F5A623',type:'dashed'}},
          {xAxis:'溜溜梅',label:{formatter:'14年\n老店'},lineStyle:{color:'#E8574A',type:'dashed'}},
          {xAxis:'菲诺',label:{formatter:'回头客\n7万+',position:'insideEndTop'},lineStyle:{color:'#4A90D9',type:'dashed'}}
        ]
      }
    }
  ]
};
chart.setOption(option);
window.addEventListener('resize',()=>chart.resize());
</script>
</body>
</html>
