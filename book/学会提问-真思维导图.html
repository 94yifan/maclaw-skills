<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学会提问 · 批判性思维 — 思维导图</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e0e0e0;
    --text-dim: #a0a0b8;
    --accent-gold: #f0c040;
    --accent-teal: #4ecdc4;
    --accent-coral: #ff6b6b;
    --accent-purple: #a78bfa;
    --accent-blue: #60a5fa;
    --accent-green: #34d399;
    --domain1: #4ecdc4;
    --domain2: #f0c040;
    --domain3: #ff6b6b;
    --domain4: #60a5fa;
    --domain5: #a78bfa;
    --flow-line: #f0c040;
    --crossref-line: #ff6b6b;
    --center-color: #f0c040;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }
  #mindmap-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    cursor: grab;
  }
  #mindmap-container:active { cursor: grabbing; }
  #mindmap-container.panning { cursor: grabbing; }
  #transform-layer {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #svg-layer {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }
  #svg-layer line, #svg-layer path { pointer-events: stroke; }
  #nodes-layer {
    position: absolute;
    top: 0; left: 0;
  }
  .mindmap-node {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
    font-weight: 600;
    box-shadow: var(--shadow);
    z-index: 1;
    border: 2px solid transparent;
  }
  .mindmap-node:hover {
    z-index: 100;
    filter: brightness(1.2);
    box-shadow: var(--shadow-lg);
  }
  .mindmap-node.center-node {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: 3px solid var(--center-color);
    color: var(--center-color);
    font-size: 20px;
    padding: 16px 28px;
    border-radius: 50%;
    width: 160px; height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.4;
    box-shadow: 0 0 40px rgba(240,192,64,0.3);
  }
  .mindmap-node.domain-node {
    font-size: 16px;
    padding: 12px 22px;
    border-radius: 14px;
  }
  .mindmap-node.sub-node {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 500;
  }
  .mindmap-node.detail-node {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 400;
    opacity: 0.85;
    max-width: 200px;
    white-space: normal;
    text-align: center;
    line-height: 1.4;
  }
  .mindmap-node.step-node {
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 20px;
  }
  /* Domain color themes */
  .domain-d1 > .domain-node, .domain-d1.domain-node { background: var(--surface2); border-color: var(--domain1); color: var(--domain1); }
  .domain-d1 .sub-node { background: #0d2b3d; border-color: rgba(78,205,196,0.4); color: #a8e6e0; }
  .domain-d1 .detail-node { background: #0a1f2e; border-color: rgba(78,205,196,0.2); color: #8ad4ce; }

  .domain-d2 > .domain-node, .domain-d2.domain-node { background: var(--surface2); border-color: var(--domain2); color: var(--domain2); }
  .domain-d2 .sub-node { background: #2a2020; border-color: rgba(240,192,64,0.4); color: #f5d878; }
  .domain-d2 .detail-node { background: #1f1818; border-color: rgba(240,192,64,0.2); color: #e8c860; }
  .domain-d2 .step-node { background: #2a2515; border-color: rgba(240,192,64,0.6); color: #f5d878; }
  .domain-d2 .step-node.step-active { background: #3a3010; border-color: var(--domain2); color: #fff; box-shadow: 0 0 20px rgba(240,192,64,0.3); }

  .domain-d3 > .domain-node, .domain-d3.domain-node { background: var(--surface2); border-color: var(--domain3); color: var(--domain3); }
  .domain-d3 .sub-node { background: #2d1a1a; border-color: rgba(255,107,107,0.4); color: #ffaaaa; }
  .domain-d3 .detail-node { background: #1f1212; border-color: rgba(255,107,107,0.2); color: #ee9090; }

  .domain-d4 > .domain-node, .domain-d4.domain-node { background: var(--surface2); border-color: var(--domain4); color: var(--domain4); }
  .domain-d4 .sub-node { background: #1a2640; border-color: rgba(96,165,250,0.4); color: #a8caf8; }
  .domain-d4 .detail-node { background: #121b2e; border-color: rgba(96,165,250,0.2); color: #90b8f0; }

  .domain-d5 > .domain-node, .domain-d5.domain-node { background: var(--surface2); border-color: var(--domain5); color: var(--domain5); }
  .domain-d5 .sub-node { background: #241e35; border-color: rgba(167,139,250,0.4); color: #cdbffa; }
  .domain-d5 .detail-node { background: #1a1530; border-color: rgba(167,139,250,0.2); color: #b8a8f5; }

  .node-collapsed .sub-node, .node-collapsed .detail-node { display: none; }

  /* Controls */
  #controls {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
  }
  #controls button {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  #controls button:hover {
    background: var(--surface2);
    border-color: var(--accent-gold);
  }
  #legend {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 1000;
    background: rgba(22,33,62,0.9);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
  }
  #legend h4 { margin-bottom: 8px; color: var(--text); font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .legend-line { width: 24px; height: 2px; flex-shrink: 0; }
  .legend-line.solid { background: var(--flow-line); border: none; }
  .legend-line.dashed { border-top: 2px dashed var(--crossref-line); background: none; height: 0; }
  .legend-line.domain { border-top: 2px solid var(--accent-teal); background: none; height: 0; }
  #tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 2000;
    background: rgba(22,33,62,0.97);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    max-width: 320px;
    opacity: 0;
    transition: opacity 0.15s;
    color: var(--text);
    box-shadow: var(--shadow-lg);
    line-height: 1.5;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip h3 { font-size: 14px; margin-bottom: 6px; color: var(--accent-gold); }
  #tooltip .tt-detail { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .flow-label {
    font-size: 10px;
    fill: var(--text-dim);
    font-style: italic;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .pulse { animation: pulse 2s infinite; }
</style>
</head>
<body>

<div id="mindmap-container">
  <div id="transform-layer">
    <svg id="svg-layer" width="2400" height="1800" viewBox="0 0 2400 1800"></svg>
    <div id="nodes-layer"></div>
  </div>
</div>

<div id="legend">
  <h4>📖 图例</h4>
  <div class="legend-item"><div class="legend-line solid"></div> 分析流程主线</div>

  <div class="legend-item"><span style="color:var(--accent-teal)">●</span> 域1 基础心态</div>
  <div class="legend-item"><span style="color:var(--accent-gold)">●</span> 域2 分析流程</div>

  <div class="legend-item"><span style="color:var(--accent-blue)">●</span> 域4 证据评估</div>
  <div class="legend-item"><span style="color:var(--accent-purple)">●</span> 域5 输出行动</div>
  <div style="margin-top:6px;color:var(--text-dim);font-size:11px">🖱️ 滚轮缩放 · 拖拽平移</div>
  <div style="color:var(--text-dim);font-size:11px">👆 点击节点展开/折叠详情</div>
</div>

<div id="controls">
  <button id="btn-zoom-in" title="放大">+</button>
  <button id="btn-zoom-out" title="缩小">−</button>
  <button id="btn-reset" title="重置视图">⟳</button>
  <button id="btn-expand-all" title="展开全部">⊞</button>
  <button id="btn-collapse-all" title="折叠详情">⊟</button>
</div>

<div id="tooltip"></div>

// ─── State ───────────────────────────────────────────────────
let scale = 0.62;
let panX = 0, panY = 0;
let isPanning = false;
let startX, startY, startPanX, startPanY;
let expandedNodes = new Set(); // nodes whose detail children are visible (all start visible)
let collapsedNodes = new Set(); // nodes whose ALL children are hidden

const container = document.getElementById('mindmap-container');
const transformLayer = document.getElementById('transform-layer');
const svgLayer = document.getElementById('svg-layer');
const nodesLayer = document.getElementById('nodes-layer');
const tooltip = document.getElementById('tooltip');

// Build node lookup
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

// ─── Initial: expand all, collapse detail-only nodes ─────────
// By default, show domain and sub nodes, but collapse detail nodes under barriers
collapsedNodes.add('d1-barriers'); // detail nodes of barriers start hidden

// ─── Rendering ───────────────────────────────────────────────
function renderAll() {
  renderNodes();
  renderConnections();
  updateTransform();
}

function getNodeVisible(nodeId) {
  // A node is visible if none of its ancestors are collapsed
  let current = nodeId;
  while (current) {
    if (collapsedNodes.has(current)) return false;
    const node = nodeMap[current];
    if (!node || !node.parentId) break;
    current = node.parentId;
  }
  return true;
}

function findChildren(nodeId) {
  return nodes.filter(n => n.parentId === nodeId);
}

function renderNodes() {
  nodesLayer.innerHTML = '';
  nodes.forEach(node => {
    if (!getNodeVisible(node.id)) return;

    const el = document.createElement('div');
    el.className = `mindmap-node domain-${node.domain}`;
    if (node.type === 'center') el.classList.add('center-node');
    if (node.type === 'domain') el.classList.add('domain-node');
    if (node.type === 'sub') el.classList.add('sub-node');
    if (node.type === 'detail') el.classList.add('detail-node');
    if (node.type === 'step') el.classList.add('step-node');
    if (node.id === 'd2-s5') el.classList.add('step-active'); // highlight the central step

    el.id = 'node-' + node.id;
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.innerHTML = (node.label || '').replace(/\n/g, '<br>');

    // Hover: tooltip
    el.addEventListener('mouseenter', (e) => showTooltip(e, node));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('mousemove', (e) => moveTooltip(e));

    // Click: expand/collapse
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleNode(node.id);
    });

    // For domain nodes, add pulse effect
    if (node.type === 'domain' && node.id === 'd2') {
      el.classList.add('pulse');
    }

    nodesLayer.appendChild(el);
  });
}

function toggleNode(nodeId) {
  const node = nodeMap[nodeId];
  if (!node) return;

  const children = findChildren(nodeId);

  // For center, toggle nothing (stay expanded)
  if (node.type === 'center') return;

  // For detail nodes, just show tooltip (no children to toggle)
  if (node.type === 'detail') return;

  if (collapsedNodes.has(nodeId)) {
    collapsedNodes.delete(nodeId);
  } else {
    if (children.length > 0) {
      collapsedNodes.add(nodeId);
    }
  }
  renderAll();
}

// ─── Connections ─────────────────────────────────────────────
function renderConnections() {
  // Clear SVG
  while (svgLayer.firstChild) svgLayer.removeChild(svgLayer.firstChild);

  // Add arrow marker definitions
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');

  // Flow arrow (gold)
  const flowMarker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  flowMarker.setAttribute('id', 'arrow-flow');
  flowMarker.setAttribute('markerWidth', '8');
  flowMarker.setAttribute('markerHeight', '6');
  flowMarker.setAttribute('refX', '8');
  flowMarker.setAttribute('refY', '3');
  flowMarker.setAttribute('orient', 'auto');
  const flowArrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  flowArrow.setAttribute('d', 'M0,0 L8,3 L0,6 Z');
  flowArrow.setAttribute('fill', '#f0c040');
  flowMarker.appendChild(flowArrow);
  defs.appendChild(flowMarker);

  // CrossRef arrow (coral)
  const crMarker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  crMarker.setAttribute('id', 'arrow-cr');
  crMarker.setAttribute('markerWidth', '8');
  crMarker.setAttribute('markerHeight', '6');
  crMarker.setAttribute('refX', '8');
  crMarker.setAttribute('refY', '3');
  crMarker.setAttribute('orient', 'auto');
  const crArrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  crArrow.setAttribute('d', 'M0,0 L8,3 L0,6 Z');
  crArrow.setAttribute('fill', '#ff6b6b');
  crMarker.appendChild(crArrow);
  defs.appendChild(crMarker);

  svgLayer.appendChild(defs);

  // Draw connections
  const drawnConnections = new Set();

  connections.forEach(conn => {
    if (!getNodeVisible(conn.from) || !getNodeVisible(conn.to)) return;
    // Avoid duplicate crossrefs
    const key = [conn.from, conn.to, conn.type].join('|');
    if (drawnConnections.has(key)) return;
    drawnConnections.add(key);

    const fromNode = nodeMap[conn.from];
    const toNode = nodeMap[conn.to];
    if (!fromNode || !toNode) return;

    const path = createConnectionPath(fromNode, toNode, conn);

    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathEl.setAttribute('d', path);

    if (conn.type === 'flow') {
      pathEl.setAttribute('stroke', '#f0c040');
      pathEl.setAttribute('stroke-width', '2.5');
      pathEl.setAttribute('fill', 'none');
      pathEl.setAttribute('marker-end', 'url(#arrow-flow)');
      pathEl.style.opacity = '0.9';
    } else if (conn.type === 'crossref') {
      pathEl.setAttribute('stroke', '#ff6b6b');
      pathEl.setAttribute('stroke-width', '1.8');
      pathEl.setAttribute('stroke-dasharray', '8,5');
      pathEl.setAttribute('fill', 'none');
      pathEl.setAttribute('marker-end', 'url(#arrow-cr)');
      pathEl.style.opacity = '0.6';
    } else {
      // domain or parent connection
      if (conn.from === 'center') {
        pathEl.setAttribute('stroke', (() => {
          const m = { d1:'#4ecdc4', d2:'#f0c040', d3:'#ff6b6b', d4:'#60a5fa', d5:'#a78bfa' };
          return m[conn.to] || '#e0e0e0';
        })());
        pathEl.setAttribute('stroke-width', '2.5');
      } else {
        pathEl.setAttribute('stroke', 'rgba(224,224,224,0.35)');
        pathEl.setAttribute('stroke-width', '1.5');
      }
      pathEl.setAttribute('fill', 'none');
    }

    svgLayer.appendChild(pathEl);

    // Add label for crossref and flow connections
    if (conn.label && (conn.type === 'crossref' || conn.type === 'flow' || conn.from === 'center')) {
      const midX = (fromNode.x + toNode.x) / 2;
      const midY = (fromNode.y + toNode.y) / 2;
      const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      textEl.setAttribute('x', midX + 10);
      textEl.setAttribute('y', midY - 6);
      textEl.setAttribute('class', 'flow-label');
      textEl.setAttribute('text-anchor', 'middle');
      if (conn.type === 'crossref') {
        textEl.setAttribute('fill', '#ff6b6b');
      } else if (conn.type === 'flow') {
        textEl.setAttribute('fill', '#f0c040');
      } else {
        textEl.setAttribute('fill', '#a0a0b8');
      }
      // Handle multi-line labels
      const lines = conn.label.split('\n');
      lines.forEach((line, i) => {
        const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        tspan.setAttribute('x', midX + 15);
        tspan.setAttribute('dy', i === 0 ? '0' : '12');
        tspan.textContent = line;
        textEl.appendChild(tspan);
      });
      svgLayer.appendChild(textEl);
    }
  });

  // Add flow arrow annotations on the right side (Step labels)
  // Already handled by flow connections above
}

function createConnectionPath(fromNode, toNode, conn) {
  const x1 = fromNode.x, y1 = fromNode.y;
  const x2 = toNode.x, y2 = toNode.y;
  const dx = x2 - x1;
  const dy = y2 - y1;

  // For the 10-step flow, use straight-ish lines with small curve
  if (conn.type === 'flow' && Math.abs(dx) < 50) {
    // Vertical flow connection
    const midY = (y1 + y2) / 2;
    return `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
  }

  // For parent connections, use smooth curves
  if (conn.type === 'parent' || conn.type === 'domain') {
    const cpDist = Math.min(Math.abs(dx), Math.abs(dy), 200) * 0.5;
    const cpx1 = x1 + (dx > 0 ? cpDist : -cpDist) * 0.3;
    const cpy1 = y1 + (dy > 0 ? cpDist : -cpDist) * 0.3;
    const cpx2 = x2 - (dx > 0 ? cpDist : -cpDist) * 0.3;
    const cpy2 = y2 - (dy > 0 ? cpDist : -cpDist) * 0.3;
    return `M${x1},${y1} C${cpx1},${cpy1} ${cpx2},${cpy2} ${x2},${y2}`;
  }

  // For crossrefs, use more dramatic curves
  const cpDist = Math.max(Math.abs(dx), Math.abs(dy), 150) * 0.6;
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  // Offset control point perpendicular to direction
  const perpX = -dy / Math.sqrt(dx*dx + dy*dy + 1) * cpDist * 0.4;
  const perpY = dx / Math.sqrt(dx*dx + dy*dy + 1) * cpDist * 0.4;
  const cpx = mx + perpX;
  const cpy = my + perpY;
  return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;

  // Default: simple bezier
  // const cpDist = Math.min(Math.abs(dx), Math.abs(dy), 120) * 0.5;
  // return `M${x1},${y1} C${x1 + cpDist},${y1} ${x2 - cpDist},${y2} ${x2},${y2}`;
}

// ─── Tooltip ─────────────────────────────────────────────────
function showTooltip(e, node) {
  if (!node.detail) return;
  tooltip.innerHTML = `<h3>${(node.label||'').replace(/\n/g,' · ')}</h3><div>${node.detail.replace(/\n/g,'<br>')}</div>`;
  tooltip.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const x = e.clientX + 18;
  const y = e.clientY + 10;
  tooltip.style.left = Math.min(x, window.innerWidth - 340) + 'px';
  tooltip.style.top = Math.min(y, window.innerHeight - 200) + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// ─── Zoom & Pan ──────────────────────────────────────────────
function updateTransform() {
  transformLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
}

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.min(Math.max(scale * delta, 0.2), 2.5);

  // Zoom toward cursor
  const rect = container.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const scaleChange = newScale / scale;
  panX = mouseX - scaleChange * (mouseX - panX);
  panY = mouseY - scaleChange * (mouseY - panY);
  scale = newScale;

  updateTransform();
}, { passive: false });

container.addEventListener('mousedown', (e) => {
  if (e.target === container || e.target === svgLayer) {
    isPanning = true;
    container.classList.add('panning');
    startX = e.clientX;
    startY = e.clientY;
    startPanX = panX;
    startPanY = panY;
  }
});

window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  panX = startPanX + (e.clientX - startX);
  panY = startPanY + (e.clientY - startY);
  updateTransform();
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  container.classList.remove('panning');
});

// ─── Touch support ───────────────────────────────────────────
let lastTouchDist = 0;
container.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isPanning = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startPanX = panX;
    startPanY = panY;
  } else if (e.touches.length === 2) {
    isPanning = false;
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: false });

container.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && isPanning) {
    panX = startPanX + (e.touches[0].clientX - startX);
    panY = startPanY + (e.touches[0].clientY - startY);
    updateTransform();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastTouchDist > 0) {
      const delta = dist / lastTouchDist;
      const newScale = Math.min(Math.max(scale * delta, 0.2), 2.5);
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = container.getBoundingClientRect();
      const mouseX = cx - rect.left;
      const mouseY = cy - rect.top;
      const scaleChange = newScale / scale;
      panX = mouseX - scaleChange * (mouseX - panX);
      panY = mouseY - scaleChange * (mouseY - panY);
      scale = newScale;
      updateTransform();
    }
    lastTouchDist = dist;
  }
}, { passive: false });

container.addEventListener('touchend', () => {
  isPanning = false;
  lastTouchDist = 0;
});

// ─── Controls ────────────────────────────────────────────────
document.getElementById('btn-zoom-in').addEventListener('click', (e) => {
  e.stopPropagation();
  scale = Math.min(scale * 1.15, 2.5);
  updateTransform();
});
document.getElementById('btn-zoom-out').addEventListener('click', (e) => {
  e.stopPropagation();
  scale = Math.max(scale * 0.87, 0.2);
  updateTransform();
});
document.getElementById('btn-reset').addEventListener('click', (e) => {
  e.stopPropagation();
  scale = 0.62;
  panX = 0;
  panY = 0;
  updateTransform();
});
document.getElementById('btn-expand-all').addEventListener('click', (e) => {
  e.stopPropagation();
  collapsedNodes.clear();
  renderAll();
});
document.getElementById('btn-collapse-all').addEventListener('click', (e) => {
  e.stopPropagation();
  // Collapse all detail and sub nodes, keep domains visible
  nodes.forEach(n => {
    if (n.type === 'detail') {
      // find parent sub node and collapse it
      const parent = nodeMap[n.parentId];
      if (parent && (parent.type === 'sub' || parent.type === 'domain')) {
        collapsedNodes.add(n.parentId);
      }
    }
  });
  // Also collapse domain children
  ['d1-barriers'].forEach(id => collapsedNodes.add(id));
  renderAll();
});

// ─── Keyboard shortcuts ──────────────────────────────────────
window.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') { scale = Math.min(scale * 1.1, 2.5); updateTransform(); }
  if (e.key === '-') { scale = Math.max(scale * 0.9, 0.2); updateTransform(); }
  if (e.key === '0') { scale = 0.62; panX = 0; panY = 0; updateTransform(); }
});

// ─── Initial Render ──────────────────────────────────────────
renderAll();

// Center the view initially
panX = 100;
panY = 80;
updateTransform();
