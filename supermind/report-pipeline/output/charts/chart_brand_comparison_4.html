<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>各品牌回头客/复购率对比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; background: white; }
  #chart { width: 800px; height: 380px; }
</style>
</head>
<body>
<div id="chart"></div>
<script>

option = {
    title: { text: '各品牌回头客/复购率对比', subtext: '数据来源: 天猫+京东', left: 'center' },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    grid: { left: '3%', right: '8%', bottom: '8%', containLabel: true },
    xAxis: { type: 'value', name: '回头客率(%)', nameLocation: 'middle', nameGap: 30 },
    yAxis: { type: 'category', data: ["椰树", "南国食品", "菲诺FreeNow", "可可满分", "品香园", "海边宽宽", "欢乐家", "林家铺子", "百草味", "来伊份", "UFC椰子水", "银鹭", "娃哈哈"], axisLabel: { fontSize: 12 } },
    series: [{
        name: '品牌名称对比',
        type: 'bar',
        data: [1350, 1250, 1150, 1050, 950, 850, 750, 650, 550, 450, 350, 250, 150],
        barWidth: '60%',
        label: { show: true, position: 'right', formatter: function(p) { return p.value; } },
        itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#4A90D9' },
            { offset: 1, color: '#7B68EE' }
        ]) }
    }]
};
var chart = echarts.init(document.getElementById('chart'));
chart.setOption(option);
</script>
</body>
</html>
