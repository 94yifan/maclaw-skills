<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800,height=420">
<title>店铺评分+粉丝数对比 · 北纬47度 vs 十月稻田</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#fff}
  #chart{width:800px;height:420px}
  .source{text-align:right;font-size:9px;color:#999;padding:2px 8px 0 0}
</style>
</head>
<body>
<div id="chart"></div>
<div class="source">来源：天猫旗舰店，2026-07-18实时抓取</div>
<script>
var chart = echarts.init(document.getElementById('chart'));
var brands = ['北纬47度','十月稻田'];

var option = {
  tooltip: {trigger:'axis'},
  legend: {
    data:['描述相符','服务态度','物流服务'],
    bottom:0, textStyle:{fontSize:10}
  },
  grid: {left:80,right:40,top:20,bottom:50},
  xAxis: {
    type:'category', data:brands,
    axisLabel:{fontSize:12,fontWeight:'bold'}
  },
  yAxis: [
    {type:'value',name:'评分',min:4.0,max:5.2},
    {type:'value',name:'粉丝数（万）',min:0,max:160,
     axisLabel:{formatter:'{value}万'},
     splitLine:{show:false}}
  ],
  series: [
    {
      name:'描述相符',type:'bar',
      data:[
        {value:4.8,itemStyle:{color:'#66BB6A'}},
        {value:4.9,itemStyle:{color:'#FF9800'}}
      ],
      barWidth:28, barGap:'10%',
      label:{show:true,position:'top',fontSize:10,formatter:'{c}'},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,0.15)'}}
    },
    {
      name:'服务态度',type:'bar',
      data:[
        {value:4.9,itemStyle:{color:'#43A047'}},
        {value:4.9,itemStyle:{color:'#F57C00'}}
      ],
      barWidth:28,
      label:{show:true,position:'top',fontSize:10,formatter:'{c}'},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,0.15)'}}
    },
    {
      name:'物流服务',type:'bar',
      data:[
        {value:4.8,itemStyle:{color:'#388E3C'}},
        {value:4.8,itemStyle:{color:'#E65100'}}
      ],
      barWidth:28,
      label:{show:true,position:'top',fontSize:10,formatter:'{c}'},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(0,0,0,0.15)'}}
    },
    {
      name:'粉丝数',type:'line',
      yAxisIndex:1,
      data:[
        {value:null,label:{show:false}},
        {value:139,label:{show:true,formatter:'139万粉丝',fontSize:10,fontWeight:'bold',color:'#E65100'}}
      ],
      symbol:'circle',symbolSize:12,
      lineStyle:{color:'#E65100',width:2},
      itemStyle:{color:'#E65100'},
      markLine:{
        silent:true, symbol:'none',
        label:{formatter:'{b}',fontSize:9,color:'#1B5E20'},
        data:[
          {name:'5年店',xAxis:'北纬47度',label:{formatter:'5年店\n32个SKU\n超7千回头客'},lineStyle:{color:'#1B5E20',type:'dashed'}},
        ]
      }
    }
  ]
};
chart.setOption(option);
window.addEventListener('resize',()=>chart.resize());
</script>
</body>
</html>
