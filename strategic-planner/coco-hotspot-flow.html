<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 32px 0 0 0;
    text-align: center;
  }
  .title { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: 1px; }
  .subtitle { font-size: 13px; color: #64748b; margin-top: 6px; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="title">热点借势营销 SOP</div>
  <div class="subtitle">追踪 → 判断 → 响应 → 植入 → 投放 → 沉淀</div>

  <svg width="780" height="800" viewBox="0 0 780 800" xmlns="http://www.w3.org/2000/svg" style="margin-top:14px;">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
      </marker>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
      </marker>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
      </marker>
    </defs>

    <!-- connectors -->
    <path d="M 390 72 L 390 98" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 390 208 L 390 236" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 580 154 L 638 154" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
    <path d="M 390 318 L 390 344" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 390 426 L 390 452" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 390 604 L 390 630" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M 210 712 L 54 712 L 54 46 L 288 46" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowBlue)"/>

    <!-- input -->
    <rect x="290" y="20" width="200" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="390" y="51" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#1e40af">热点出现</text>

    <!-- judge -->
    <rect x="200" y="100" width="380" height="108" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="390" y="124" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#92400e">热点追踪 · 三问判断</text>
    <text x="390" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78350f">1 能不能玩梗</text>
    <text x="390" y="170" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78350f">2 是不是二创期</text>
    <text x="390" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#78350f">3 挂不挂得上品牌</text>

    <!-- abandon -->
    <rect x="640" y="122" width="112" height="64" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="696" y="147" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#b91c1c">放弃</text>
    <text x="696" y="167" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#b91c1c">不追</text>

    <text x="400" y="224" text-anchor="start" dominant-baseline="central" font-size="11" fill="#64748b">三问全过</text>
    <text x="608" y="142" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#dc2626">任一不过</text>

    <!-- stage1 -->
    <rect x="210" y="238" width="360" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="390" y="268" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#0f172a">快速响应 · 轻内容矩阵</text>
    <text x="390" y="293" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#64748b">表情包 · AI视觉 · 营销号话题 · 评论区引导</text>

    <!-- stage2 -->
    <rect x="210" y="346" width="360" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="390" y="376" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#0f172a">内容打法 · 品牌自然植入</text>
    <text x="390" y="401" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#64748b">视觉符号 · 社交货币 · 用户共创</text>

    <!-- stage3: 投放配套 (expanded) -->
    <rect x="210" y="454" width="360" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="390" y="482" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#0f172a">投放配套</text>
    <text x="390" y="512" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#64748b">人群 · 四向定向</text>
    <text x="390" y="536" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#64748b">渠道 · 信息流 / 视频流 / 搜索卡热点词</text>
    <text x="390" y="562" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#64748b">预算 · KOL48% · 信息流30% · 视频流15% · 搜索7%</text>

    <!-- stage4 -->
    <rect x="210" y="632" width="360" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="390" y="662" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#0f172a">效果验证 · 话题溢出</text>
    <text x="390" y="687" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#64748b">关联曝光 2.2 倍 · 沉淀打法</text>

    <!-- loop label -->
    <text x="390" y="762" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2563eb">沉淀打法，复用到下一个热点</text>
  </svg>
</body>
</html>
